<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>录像操作台</title>
<link rel="stylesheet" href="../ui/theme.css">
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="rail"></div>

<header class="bar">
  <div class="brand">
    <span class="brand-dot" aria-hidden="true"></span>
    <div class="brand-text">
      <h1>录像操作台</h1>
      <p>全部内容仅存本机</p>
    </div>
  </div>
  <button class="icon-btn" id="openLibrary" title="素材库" aria-label="素材库">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M3 20h18"/><path d="M10 9.5l4 2.5-4 2.5z" fill="currentColor" stroke="none"/></svg>
  </button>
</header>

<div class="seg" role="tablist">
  <button class="seg-btn" data-tool="record" role="tab" aria-selected="true">录屏</button>
  <button class="seg-btn" data-tool="shot" role="tab" aria-selected="false">截图</button>
</div>

<!-- ───────── 录屏 ───────── -->
<section id="idle">
  <div class="tiles" role="group" aria-label="录制模式">
    <button class="tile" data-mode="tab" aria-pressed="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></svg>
      <span>标签页</span>
    </button>
    <button class="tile" data-mode="area" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 8V5a2 2 0 012-2h3M16 3h3a2 2 0 012 2v3M21 16v3a2 2 0 01-2 2h-3M8 21H5a2 2 0 01-2-2v-3"/><circle cx="12" cy="12" r="2.2" fill="currentColor" stroke="none"/></svg>
      <span>区域</span>
    </button>
    <button class="tile" data-mode="screen" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
      <span>屏幕</span>
    </button>
    <button class="tile" data-mode="camera" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.2"/></svg>
      <span>摄像头</span>
    </button>
  </div>

  <div class="group">
    <span class="glabel">输入源</span>
    <div class="chips">
      <button class="chip" data-src="mic" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>
        麦克风
      </button>
      <button class="chip" data-src="audio" aria-pressed="false" id="sysAudioChip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M16 9a4 4 0 010 6"/></svg>
        <span id="sysAudioLabel">标签页声音</span>
      </button>
      <button class="chip" data-src="camera" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg>
        画中画
      </button>
    </div>
    <div class="devices" id="deviceRow" hidden>
      <select id="micDevice" aria-label="麦克风设备"></select>
      <select id="cameraDevice" aria-label="摄像头设备"></select>
    </div>
  </div>

  <div class="dials">
    <label><span>格式</span><select id="format"></select></label>
    <label><span>画质</span><select id="quality"></select></label>
    <label><span>倒计时</span><select id="countdown">
      <option value="0">关</option><option value="3">3s</option><option value="5">5s</option>
    </select></label>
  </div>

  <button class="go" id="start"><span class="go-dot"></span>开始录制</button>
  <div class="msg" id="error" hidden></div>
</section>

<!-- ───────── 截图 ───────── -->
<section id="shotPane" hidden>
  <div class="tiles three" role="group" aria-label="截图模式">
    <button class="tile" data-shot="visible" aria-pressed="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M8 10h8"/></svg>
      <span>可见区域</span>
    </button>
    <button class="tile" data-shot="full" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M9 7h6M9 12h6M9 17h6"/></svg>
      <span>整个页面</span>
    </button>
    <button class="tile" data-shot="area" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 8V5a2 2 0 012-2h3M16 3h3a2 2 0 012 2v3M21 16v3a2 2 0 01-2 2h-3M8 21H5a2 2 0 01-2-2v-3"/></svg>
      <span>选定区域</span>
    </button>
  </div>

  <div class="dials two">
    <label><span>格式</span><select id="shotFormat"></select></label>
    <label id="shotDelayRow"><span>延时</span><select id="shotDelay">
      <option value="0">立即</option><option value="3">3s</option><option value="5">5s</option>
    </select></label>
  </div>

  <button class="go" id="shoot"><span class="go-dot square"></span>截图</button>
  <div class="msg" id="shotError" hidden></div>
</section>

<!-- ───────── 录制中 ───────── -->
<section id="live" hidden>
  <div class="deck">
    <div class="deck-top">
      <span class="live-dot" id="liveDot"></span>
      <span class="deck-label" id="liveState">正在录制</span>
    </div>
    <div class="timer num" id="timer">00:00</div>
    <div class="deck-meta num" id="liveMeta">已写入 0 B</div>
  </div>
  <div class="duo">
    <button class="btn" id="pause">暂停</button>
    <button class="btn primary" id="stop">结束并保存</button>
  </div>
  <button class="link danger" id="cancel">放弃这段录制</button>
</section>

<!-- ───────── 其他标签页的录制 ─────────
     控制条窗口撤掉后，这里是它们唯一的操作入口，所以每一路都要能单独结束。 -->
<section id="others" hidden>
  <div class="others-head">
    <span class="glabel" id="othersText"></span>
    <button class="link danger" id="stopOthers">全部结束</button>
  </div>
  <div class="rows" id="othersRows"></div>
</section>

<footer class="meter">
  <div class="meter-row">
    <span id="storageText">统计中…</span>
  </div>
  <div class="meter-bar"><i id="storageBar" style="width:0"></i></div>
</footer>

<script type="module" src="popup.js"></script>
</body>
</html>
